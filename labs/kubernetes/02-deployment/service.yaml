apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
  labels:
    app: webapp

spec:
  # ClusterIP: only reachable within the cluster
  # Use NodePort or LoadBalancer to expose externally
  type: ClusterIP

  # Select pods with these labels — these become the Service's endpoints
  # Any pod with app=webapp, regardless of which deployment created it, gets traffic
  selector:
    app: webapp

  ports:
  - name: http
    protocol: TCP
    port: 80          # Port the Service listens on (cluster-internal)
    targetPort: http  # Port on the Pod to forward to (matches the named port in deployment.yaml)

---
# Optional: expose via NodePort for external access during lab
# Uncomment and apply if you want to access without port-forward
