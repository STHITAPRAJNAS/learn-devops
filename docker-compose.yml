version: "3.9"

services:
  # Next.js frontend
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops-learning-app
    ports:
      - "3000:3000"
    volumes:
      - ./content:/app/public/content:ro
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_AGENT_API_URL=http://localhost:8000
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Google ADK AI Tutor agent
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: devops-ai-tutor
    ports:
      - "8000:8000"
    volumes:
      - ./content:/content:ro
      - ./labs:/labs:ro
    env_file:
      - ./agent/.env
    environment:
      - ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s
